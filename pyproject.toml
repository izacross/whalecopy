[project]
name = "whalecopy"
version = "0.1.0"
description = "Mirror top Polymarket wallets onto matching Kalshi markets (paper by default)."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "cryptography>=42",
    "rapidfuzz>=3.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
whalecopy = "whalecopy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["whalecopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
